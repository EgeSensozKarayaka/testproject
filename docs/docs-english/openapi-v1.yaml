      operationId: replaceDefaultNotificationPolicy
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultNotificationPolicyWrite'
      responses:
        '200':
          description: Policy replaced
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPolicy'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /api/v1/groups/{group_id}/notification-policy:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Notifications]
      operationId: getGroupNotificationPolicy
      responses:
        '200':
          description: Effective group notification policy
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPolicy'
    put:
      tags: [Notifications]
      operationId: replaceGroupNotificationPolicy
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPolicyWrite'
      responses:
        '200':
          description: Group policy replaced
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPolicy'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /api/v1/public-pages:
    get:
      tags: [Public pages]
      operationId: listPublicPages
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Owner public-page configurations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPagePage'
    post:
      tags: [Public pages]
      operationId: createPublicPage
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicPageWrite'
      responses:
        '201':
          description: Draft page created
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPage'
  /api/v1/public-pages/{page_id}:
    parameters:
      - $ref: '#/components/parameters/PageId'
    get:
      tags: [Public pages]
      operationId: getPublicPage
      responses:
        '200':
          description: Private page configuration
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPage'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
    patch:
      tags: [Public pages]
      operationId: updatePublicPage
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicPagePatch'
      responses:
        '200':
          $ref: '#/components/responses/PublicPageCommandResult'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags: [Public pages]
      operationId: deletePublicPage
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Page deleted and public access closed
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/v1/public-pages/{page_id}/components:
    put:
      tags: [Public pages]
      operationId: replacePublicPageComponents
      parameters:
        - $ref: '#/components/parameters/PageId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 500
                  items:
                    $ref: '#/components/schemas/PublicComponentWrite'
      responses:
        '200':
          $ref: '#/components/responses/PublicPageCommandResult'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/v1/public-pages/{page_id}/publish:
    post:
      tags: [Public pages]
      operationId: publishPublicPage
      parameters:
        - $ref: '#/components/parameters/PageId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Page published; raw link token is shown once
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicLinkResult'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/v1/public-pages/{page_id}/disable:
    post:
      tags: [Public pages]
      operationId: disablePublicPage
      parameters:
        - $ref: '#/components/parameters/PageId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          $ref: '#/components/responses/PublicPageCommandResult'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/v1/public-pages/{page_id}/rotate-link:
    post:
      tags: [Public pages]
      operationId: rotatePublicPageLink
      parameters:
        - $ref: '#/components/parameters/PageId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Link rotated atomically; raw token is shown once
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicLinkResult'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/v1/events:
    get:
      tags: [Realtime]
      operationId: streamPrivateEvents
      parameters:
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: Owner-scoped, non-durable SSE invalidation stream
          content:
            text/event-stream:
              schema:
                type: string
                description: Frames defined in REALTIME_CONTRACT.md
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
  /api/public/v1/status-pages/{public_token}:
    get:
      tags: [Public]
      operationId: getPublicStatusPage
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicToken'
        - in: header
          name: If-None-Match
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Allowlisted public projection
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStatusSnapshot'
        '304':
          description: Projection has not changed
        '404':
          $ref: '#/components/responses/PublicNotFoundProblem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
  /api/public/v1/status-pages/{public_token}/events:
    get:
      tags: [Public, Realtime]
      operationId: streamPublicStatusPageEvents
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicToken'
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: Page-scoped, non-durable SSE invalidation stream
          content:
            text/event-stream:
              schema:
                type: string
                description: Frames defined in REALTIME_CONTRACT.md
        '404':
          $ref: '#/components/responses/PublicNotFoundProblem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: site_monitor_session
  parameters:
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
        minLength: 20
        maxLength: 512
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[\x21-\x7E]+$'
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema:
        type: string
        pattern: '^"rv-[0-9]+"$'
    LastEventId:
      in: header
      name: Last-Event-ID
      required: false
      schema:
        type: string
        format: uuid
    Cursor:
      in: query
      name: cursor
      required: false
      schema:
        type: string
        maxLength: 1024
    Limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    CheckId:
      in: path
      name: check_id
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    GroupId:
      in: path
      name: group_id
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PageId:
      in: path
      name: page_id
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PublicToken:
      in: path
      name: public_token
      required: true
      description: Opaque secret; must be redacted from logs and telemetry
      schema:
        type: string
        minLength: 32
        maxLength: 128
  headers:
    ETag:
      description: Strong resource or projection version tag
      schema:
        type: string
    Location:
      description: Canonical resource URI
      schema:
        type: string
        format: uri-reference
    RequestId:
      description: Request correlation identifier
      schema:
        type: string
        format: uuid
  responses:
    Accepted:
      description: Accepted without revealing account existence
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcceptedResponse'
    CheckCommandResult:
      description: Current check after idempotent command
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Check'
    PublicPageCommandResult:
      description: Current private public-page configuration
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicPage'
    BadRequestProblem:
      description: Invalid request or cursor
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AuthenticationProblem:
      description: Authentication required or credentials invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CsrfProblem:
      description: CSRF or origin verification failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFoundProblem:
      description: Resource absent, deleted, or owned by another user
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PublicNotFoundProblem:
      description: Public page absent, disabled, or token invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ConflictProblem:
      description: Domain, idempotency, or resource conflict
      headers:
        Retry-After:
          description: Present for idempotency_in_progress
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match does not match current resource version
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationProblem:
      description: Request validation or configuration failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: If-Match header is required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimitProblem:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Required dependency or schema is unavailable
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Uuid:
      type: string
      format: uuid
    Instant:
      type: string
      format: date-time
    ResourceVersion:
      type: string
      pattern: '^[0-9]+$'
    NonNegativeIntegerString:
      type: string
      pattern: '^[0-9]+$'
    ServiceHealth:
      type: object
      additionalProperties: false
      required: [service, status, timestamp, version]
      properties:
        service:
          type: string
        status:
          type: string
          enum: [ok, unavailable]
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          minLength: 1
    AcceptedResponse:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted:
          type: boolean
          const: true
    ValidationIssue:
      type: object
      additionalProperties: false
      required: [pointer, code, message]
      properties:
        pointer:
          type: string
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        message:
          type: string
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, request_id, retryable]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        request_id:
          type: string
          format: uuid
        retryable:
          type: boolean
        retry_after_seconds:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
    PageMeta:
      type: object
      additionalProperties: false
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, display_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 15
          maxLength: 128
        display_name:
          type: string
          minLength: 1
          maxLength: 120
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 128
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 512
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 512
        password:
          type: string
          minLength: 15
          maxLength: 128
    User:
      type: object
      additionalProperties: false
      required: [id, email, display_name, email_verified, resource_version, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        email_verified:
          type: boolean
        resource_version:
          $ref: '#/components/schemas/ResourceVersion'
        created_at:
          $ref: '#/components/schemas/Instant'
    UserPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
    SessionView:
      type: object
      additionalProperties: false
      required: [user, expires_at, csrf_token]
      properties:
        user:
          $ref: '#/components/schemas/User'
        expires_at:
          $ref: '#/components/schemas/Instant'
        csrf_token:
          type: string
          description: Session-bound bootstrap value; never logged or persisted by the client
    ExecutionState:
      type: string
      enum: [ACTIVE, PAUSED]
    HealthState:
      type: string
      enum: [UNKNOWN, UP, SUSPECT, DOWN]
    FreshnessState:
      type: string
      enum: [FRESH, STALE]
    CurrentIncidentSummary:
      type: object
      additionalProperties: false
      required: [id, started_at, confirmed_at, observation_mode, observed_duration_ms]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        started_at:
          $ref: '#/components/schemas/Instant'
        confirmed_at:
          $ref: '#/components/schemas/Instant'
        observation_mode:
          type: string
          enum: [OBSERVED, UNOBSERVED]
        observed_duration_ms:
          $ref: '#/components/schemas/NonNegativeIntegerString'
    CurrentStatus:
      type: object
      additionalProperties: false
      required:
        [
          check_id,
          health_state,
          execution_state,
          freshness_state,
          maintenance,
          last_response_time_ms,
          last_checked_at,
          current_incident,
          state_version,
        ]
      properties:
        check_id:
          $ref: '#/components/schemas/Uuid'
        health_state:
          $ref: '#/components/schemas/HealthState'
        execution_state:
          $ref: '#/components/schemas/ExecutionState'
        freshness_state:
          $ref: '#/components/schemas/FreshnessState'
        maintenance:
          type: object
          additionalProperties: false
          required: [active, until]
          properties:
            active:
              type: boolean
            until:
              oneOf:
                - $ref: '#/components/schemas/Instant'
                - type: 'null'
        last_response_time_ms:
          type: [integer, 'null']
          minimum: 0
        last_checked_at:
          oneOf:
            - $ref: '#/components/schemas/Instant'
            - type: 'null'
        current_incident:
          oneOf:
            - $ref: '#/components/schemas/CurrentIncidentSummary'
            - type: 'null'
        state_version:
          $ref: '#/components/schemas/ResourceVersion'
    CheckWriteFields:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        url:
          type: string
          format: uri
          maxLength: 2048
          description: >-
            Absolute HTTP(S) URL. Credentials are forbidden. The fragment is removed during
            canonicalization and the canonical UTF-8 serialization must not exceed 4096 bytes.
        interval_seconds:
          type: integer
          minimum: 30
          maximum: 3600
        timeout_ms:
          type: integer
          minimum: 100
          maximum: 60000
        expected_status_code:
          type: integer
          minimum: 100
          maximum: 599
        expected_body_substring:
          type: [string, 'null']
          minLength: 1
          maxLength: 2048
          description: >-
            Case-sensitive literal substring. In addition to this character bound, the API
            enforces a 2048-byte UTF-8 limit. Null disables body matching.
        group_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    CheckCreate:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CheckWriteFields'
        - type: object
          required: [name, url, interval_seconds, timeout_ms, expected_status_code]
    CheckPatch:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CheckWriteFields'
        - type: object
          minProperties: 1
    Check:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - url
        - interval_seconds
        - timeout_ms
        - expected_status_code
        - expected_body_substring
        - group_id
        - execution_state
