openapi: 3.1.0
info:
  title: Site Availability Monitor API
  version: 1.0.0-design
  summary: Private management and public status APIs
  description: >-
    Canonical Phase 4 design contract. This file describes the intended v1 API;
    it does not claim that the routes are implemented yet. Error semantics are
    defined in API_ERRORS.md and realtime semantics in REALTIME_CONTRACT.md.
servers:
  - url: http://localhost:13000
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Account
  - name: Dashboard
  - name: Checks
  - name: Groups
  - name: Incidents
  - name: Maintenance
  - name: Notifications
  - name: Public pages
  - name: Public
  - name: Realtime
security:
  - cookieAuth: []
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      description: >-
        Creates a pending account and queues a verification email. The same 202 response is
        returned when the address is already registered. Requires an exact trusted Origin (or
        same-origin Referer fallback), Fetch Metadata validation, and application/json.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      description: >-
        Creates an opaque server-side session. Unknown accounts, invalid passwords, pending
        verification, and disabled accounts all return the same invalid_credentials response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; session cookie is set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      description: >-
        Idempotently clears the browser cookie. A valid presented session is revoked after CSRF
        validation; an absent or invalid session still returns 204.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session revoked or already absent
        '403':
          $ref: '#/components/responses/CsrfProblem'
  /api/v1/auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      responses:
        '200':
          description: Current session and user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
  /api/v1/auth/email-verifications:
    post:
      tags: [Auth]
      operationId: requestEmailVerification
      description: >-
        Queues a verification email when eligible and always returns the same accepted response.
        The endpoint applies anonymous origin, media-type, idempotency, and rate-limit controls.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
  /api/v1/auth/email-verifications/confirm:
    post:
      tags: [Auth]
      operationId: confirmEmailVerification
      description: >-
        Consumes a single-use verification token. Invalid, expired, or already-consumed tokens
        return invalid_or_expired_token without revealing token state.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: Verification consumed or already confirmed
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /api/v1/auth/password-resets:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      description: >-
        Queues a reset email when eligible and always returns the same accepted response. The
        endpoint applies anonymous origin, media-type, idempotency, and rate-limit controls.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
  /api/v1/auth/password-resets/confirm:
    post:
      tags: [Auth]
      operationId: confirmPasswordReset
      description: >-
        Consumes a single-use reset token, changes the password, and revokes every session. An
        invalid, expired, or consumed token returns invalid_or_expired_token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: Password changed and previous sessions revoked
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /api/v1/me:
    get:
      tags: [Account]
      operationId: getMe
      responses:
        '200':
          description: User profile
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
    patch:
      tags: [Account]
      operationId: updateMe
      description: Requires a valid session, matching session-bound CSRF token, and current strong ETag.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: Updated profile
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/CsrfProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Owner-scoped current-state snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardPage'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
  /api/v1/checks:
    get:
      tags: [Checks]
      operationId: listChecks
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: group_id
          schema:
            $ref: '#/components/schemas/Uuid'
        - in: query
          name: health
          schema:
            $ref: '#/components/schemas/HealthState'
        - in: query
          name: execution_state
          schema:
            $ref: '#/components/schemas/ExecutionState'
        - in: query
          name: freshness
          schema:
            $ref: '#/components/schemas/FreshnessState'
      responses:
        '200':
          description: Check page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckPage'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
    post:
      tags: [Checks]
      operationId: createCheck
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckCreate'
      responses:
        '201':
          description: Check created
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
  /api/v1/checks/{check_id}:
    parameters:
      - $ref: '#/components/parameters/CheckId'
    get:
      tags: [Checks]
      operationId: getCheck
      responses:
        '200':
          description: Check configuration; current status is a separate projection
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
    patch:
      tags: [Checks]
      operationId: updateCheck
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckPatch'
      responses:
        '200':
          description: Check updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
    delete:
      tags: [Checks]
      operationId: deleteCheck
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Check soft-deleted
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
  /api/v1/checks/{check_id}/pause:
    post:
      tags: [Checks]
      operationId: pauseCheck
      parameters:
        - $ref: '#/components/parameters/CheckId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          $ref: '#/components/responses/CheckCommandResult'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
  /api/v1/checks/{check_id}/resume:
    post:
      tags: [Checks]
      operationId: resumeCheck
      parameters:
        - $ref: '#/components/parameters/CheckId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          $ref: '#/components/responses/CheckCommandResult'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
  /api/v1/checks/{check_id}/runs:
    parameters:
      - $ref: '#/components/parameters/CheckId'
    get:
      tags: [Checks]
      operationId: listCheckRuns
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Diagnostic run page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckRunPage'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
    post:
      tags: [Checks]
      operationId: requestManualRun
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Durable manual run request accepted or coalesced
          headers:
            Cache-Control:
              description: Manual command receipts are private and must not be cached
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualRunReceipt'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
  /api/v1/checks/{check_id}/history:
    get:
      tags: [Checks]
      operationId: getCheckHistory
      parameters:
        - $ref: '#/components/parameters/CheckId'
        - in: query
          name: period
          required: true
          schema:
            type: string
            enum: [day, week, month]
      responses:
        '200':
          description: Bounded history aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/checks/{check_id}/prediction:
    get:
      tags: [Checks]
      operationId: getCheckPrediction
      parameters:
        - $ref: '#/components/parameters/CheckId'
      responses:
        '200':
          description: Optional prediction state; unavailable is not an HTTP error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResponse'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /api/v1/groups:
    get:
      tags: [Groups]
      operationId: listGroups
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Group page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupPage'
    post:
      tags: [Groups]
      operationId: createGroup
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupWrite'
      responses:
        '201':
          description: Group created
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
  /api/v1/groups/{group_id}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Groups]
      operationId: getGroup
      responses:
        '200':
          description: Group
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
    patch:
      tags: [Groups]
      operationId: updateGroup
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupPatch'
      responses:
        '200':
          description: Group updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
    delete:
      tags: [Groups]
      operationId: deleteGroup
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Group deleted; checks become ungrouped
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
  /api/v1/incidents:
    get:
      tags: [Incidents]
      operationId: listIncidents
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: check_id
          schema:
            $ref: '#/components/schemas/Uuid'
        - in: query
          name: group_id
          schema:
            $ref: '#/components/schemas/Uuid'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/IncidentState'
        - in: query
          name: started_before
          description: Return incidents that start before this exclusive UTC boundary.
          schema:
            $ref: '#/components/schemas/Instant'
        - in: query
          name: ended_after
          description: Return incidents whose wall-clock span ends after this exclusive UTC boundary.
          schema:
            $ref: '#/components/schemas/Instant'
      responses:
        '200':
          description: Incident page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentPage'
  /api/v1/incidents/{incident_id}:
    get:
      tags: [Incidents]
      operationId: getIncident
      parameters:
        - in: path
          name: incident_id
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Incident with observation segments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /api/v1/maintenance-windows:
    get:
      tags: [Maintenance]
      operationId: listMaintenanceWindows
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: state
          schema:
            $ref: '#/components/schemas/MaintenanceState'
        - in: query
          name: check_id
          schema:
            $ref: '#/components/schemas/Uuid'
        - in: query
          name: group_id
          schema:
            $ref: '#/components/schemas/Uuid'
        - in: query
          name: starts_before
          description: Return windows that start before this exclusive UTC boundary.
          schema:
            $ref: '#/components/schemas/Instant'
        - in: query
          name: ends_after
          description: Return windows that end after this exclusive UTC boundary.
          schema:
            $ref: '#/components/schemas/Instant'
      responses:
        '200':
          description: Maintenance window page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindowPage'
    post:
      tags: [Maintenance]
      operationId: createMaintenanceWindow
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceWindowWrite'
      responses:
        '201':
          description: Maintenance window created
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindow'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /api/v1/maintenance-windows/{window_id}:
    parameters:
      - in: path
        name: window_id
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      tags: [Maintenance]
      operationId: getMaintenanceWindow
      responses:
        '200':
          description: Maintenance window
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindow'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
    patch:
      tags: [Maintenance]
      operationId: updateMaintenanceWindow
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceWindowPatch'
      responses:
        '200':
          description: Maintenance window updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindow'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags: [Maintenance]
      operationId: cancelMaintenanceWindow
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Maintenance window cancelled
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/v1/notification-recipients:
    get:
      tags: [Notifications]
      operationId: listNotificationRecipients
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Notification recipients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRecipientPage'
    post:
      tags: [Notifications]
      operationId: createNotificationRecipient
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '201':
          description: Recipient created; verification scheduled
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRecipient'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /api/v1/notification-recipients/{recipient_id}:
    delete:
      tags: [Notifications]
      operationId: deleteNotificationRecipient
      parameters:
        - in: path
          name: recipient_id
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Recipient disabled
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/v1/notification-recipients/{recipient_id}/verification:
