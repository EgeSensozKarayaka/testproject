      tags: [Notifications]
      operationId: resendNotificationRecipientVerification
      parameters:
        - in: path
          name: recipient_id
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
  /api/v1/notification-recipients/{recipient_id}/test-email:
    post:
      tags: [Notifications]
      operationId: sendNotificationRecipientTestEmail
      parameters:
        - in: path
          name: recipient_id
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'
  /api/v1/notification-recipient-verifications/confirm:
