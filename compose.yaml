name: site-availability-monitor

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-site_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-site_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-15432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 128mb
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:v1.31.4
    environment:
      MP_MAX_MESSAGES: '5000'
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test:
        - CMD
        - /mailpit
        - readyz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  target-simulator:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
      args:
        APP: target-simulator
    environment:
      NODE_ENV: development
      PORT: 4010
      SERVICE_NAME: target-simulator
      SERVICE_VERSION: 0.1.0
    ports:
      - '127.0.0.1:${TARGET_SIMULATOR_PORT:-4010}:4010'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:4010/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    init: true
    restart: unless-stopped
    networks:
      - backend

  migrate:
    profiles: [app, prediction]
    build:
      context: .
      dockerfile: infra/docker/database.Dockerfile
    command: [node, dist/cli.js, migrate]
    environment:
      DATABASE_ROOT: /app/database
      DATABASE_URL: postgresql://${POSTGRES_USER:-site_monitor}:${POSTGRES_PASSWORD:-local_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-site_monitor}
      NODE_ENV: development
      SERVICE_VERSION: 0.1.0
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: 'no'
    networks:
      - backend

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
      args:
        APP: api
    environment:
      CHECKS_PER_OWNER_LIMIT: ${CHECKS_PER_OWNER_LIMIT:-500}
      DATABASE_URL: postgresql://${POSTGRES_USER:-site_monitor}:${POSTGRES_PASSWORD:-local_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-site_monitor}
      GROUPS_PER_OWNER_LIMIT: ${GROUPS_PER_OWNER_LIMIT:-100}
      HISTORY_CURSOR_TTL_SECONDS: ${HISTORY_CURSOR_TTL_SECONDS:-900}
      HISTORY_HOUR_RAW_TAIL_SECONDS: ${HISTORY_HOUR_RAW_TAIL_SECONDS:-7200}
      HISTORY_MINUTE_RAW_TAIL_SECONDS: ${HISTORY_MINUTE_RAW_TAIL_SECONDS:-900}
      HISTORY_RETRY_AFTER_SECONDS: ${HISTORY_RETRY_AFTER_SECONDS:-5}
      HISTORY_STATEMENT_TIMEOUT_MS: ${HISTORY_STATEMENT_TIMEOUT_MS:-2000}
      MAINTENANCE_WINDOWS_PER_OWNER_LIMIT: ${MAINTENANCE_WINDOWS_PER_OWNER_LIMIT:-500}
      NODE_ENV: development
      PORT: 3000
      REALTIME_API_GLOBAL_CONNECTION_LIMIT: ${REALTIME_API_GLOBAL_CONNECTION_LIMIT:-1000}
      REALTIME_API_HEARTBEAT_MS: ${REALTIME_API_HEARTBEAT_MS:-15000}
      REALTIME_API_IP_CONNECTION_LIMIT: ${REALTIME_API_IP_CONNECTION_LIMIT:-50}
      REALTIME_API_LISTENER_GRACE_MS: ${REALTIME_API_LISTENER_GRACE_MS:-5000}
      REALTIME_API_OWNER_CONNECTION_LIMIT: ${REALTIME_API_OWNER_CONNECTION_LIMIT:-20}
      REALTIME_API_PROJECTION_CONCURRENCY: ${REALTIME_API_PROJECTION_CONCURRENCY:-8}
      REALTIME_API_PROJECTION_QUEUE_LIMIT: ${REALTIME_API_PROJECTION_QUEUE_LIMIT:-2048}
      REALTIME_API_QUEUE_BYTE_LIMIT: ${REALTIME_API_QUEUE_BYTE_LIMIT:-1048576}
      REALTIME_API_QUEUE_EVENT_LIMIT: ${REALTIME_API_QUEUE_EVENT_LIMIT:-256}
      REALTIME_API_SESSION_CONNECTION_LIMIT: ${REALTIME_API_SESSION_CONNECTION_LIMIT:-5}
      REALTIME_API_SESSION_REVALIDATE_BATCH_SIZE: ${REALTIME_API_SESSION_REVALIDATE_BATCH_SIZE:-100}
      REALTIME_API_SESSION_REVALIDATE_MS: ${REALTIME_API_SESSION_REVALIDATE_MS:-60000}
      REALTIME_API_SHUTDOWN_GRACE_MS: ${REALTIME_API_SHUTDOWN_GRACE_MS:-5000}
      SERVICE_NAME: api
      SERVICE_VERSION: 0.1.0
      WEB_ORIGIN: http://localhost:${WEB_PORT:-15173}
      PUBLIC_WEB_URL: http://localhost:${WEB_PORT:-15173}
    ports:
      - '127.0.0.1:${API_PORT:-13000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    networks:
      - backend

  monitor-worker:
    profiles: [app]
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
      args:
        APP: monitor-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-site_monitor}:${POSTGRES_PASSWORD:-local_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-site_monitor}
      MONITOR_CANDIDATE_BATCH_SIZE: ${MONITOR_CANDIDATE_BATCH_SIZE:-128}
      MONITOR_DB_POOL_SIZE: ${MONITOR_DB_POOL_SIZE:-8}
      MONITOR_DISPATCH_POLL_MS: ${MONITOR_DISPATCH_POLL_MS:-100}
      MONITOR_FRESHNESS_POLL_MS: ${MONITOR_FRESHNESS_POLL_MS:-250}
      MONITOR_GLOBAL_CONCURRENCY: ${MONITOR_GLOBAL_CONCURRENCY:-64}
      MONITOR_HEARTBEAT_MS: ${MONITOR_HEARTBEAT_MS:-5000}
      MONITOR_LEASE_GRACE_MS: ${MONITOR_LEASE_GRACE_MS:-15000}
      MONITOR_PER_HOST_CONCURRENCY: ${MONITOR_PER_HOST_CONCURRENCY:-4}
      MONITOR_PER_OWNER_CONCURRENCY: ${MONITOR_PER_OWNER_CONCURRENCY:-32}
      MONITOR_RECOVERY_POLL_MS: ${MONITOR_RECOVERY_POLL_MS:-1000}
      MONITOR_SCHEDULE_BATCH_SIZE: ${MONITOR_SCHEDULE_BATCH_SIZE:-64}
      MONITOR_SCHEDULER_GRACE_MS: ${MONITOR_SCHEDULER_GRACE_MS:-5000}
      MONITOR_SCHEDULER_POLL_MS: ${MONITOR_SCHEDULER_POLL_MS:-250}
      MONITOR_SHUTDOWN_GRACE_MS: ${MONITOR_SHUTDOWN_GRACE_MS:-30000}
      NODE_ENV: development
      PORT: 3011
      PROBE_ALLOWED_PORTS: ${PROBE_ALLOWED_PORTS:-80,443,4010}
      PROBE_CONNECT_TIMEOUT_MS: ${PROBE_CONNECT_TIMEOUT_MS:-10000}
      PROBE_DEV_ALLOWED_ORIGINS: ${PROBE_DEV_ALLOWED_ORIGINS:-http://target-simulator:4010}
      PROBE_MAX_DNS_RESULTS: ${PROBE_MAX_DNS_RESULTS:-16}
      PROBE_MAX_HEADER_BYTES: ${PROBE_MAX_HEADER_BYTES:-16384}
      PROBE_MAX_REDIRECTS: ${PROBE_MAX_REDIRECTS:-5}
      PROBE_MAX_RESPONSE_BYTES: ${PROBE_MAX_RESPONSE_BYTES:-1048576}
      PROBE_USER_AGENT: ${PROBE_USER_AGENT:-SiteAvailabilityMonitor/0.1}
      SERVICE_NAME: monitor-worker
      SERVICE_VERSION: 0.1.0
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3011/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    networks:
      - backend

  notification-worker:
    profiles: [app]
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
      args:
        APP: notification-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-site_monitor}:${POSTGRES_PASSWORD:-local_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-site_monitor}
      NODE_ENV: development
      PORT: 3012
      SERVICE_NAME: notification-worker
      SERVICE_VERSION: 0.1.0
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      PUBLIC_WEB_URL: http://localhost:${WEB_PORT:-15173}
      AUTH_EMAIL_FROM: Site Monitor <no-reply@site-monitor.local>
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3012/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    networks:
      - backend

  housekeeping-worker:
    profiles: [app]
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
      args:
        APP: housekeeping-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-site_monitor}:${POSTGRES_PASSWORD:-local_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-site_monitor}
      HOUSEKEEPING_DB_POOL_SIZE: ${HOUSEKEEPING_DB_POOL_SIZE:-4}
      HOUSEKEEPING_DISCOVERY_BATCH_SIZE: ${HOUSEKEEPING_DISCOVERY_BATCH_SIZE:-500}
      HOUSEKEEPING_DISCOVERY_POLL_MS: ${HOUSEKEEPING_DISCOVERY_POLL_MS:-1000}
      HOUSEKEEPING_PARTITION_POLL_MS: ${HOUSEKEEPING_PARTITION_POLL_MS:-60000}
      HOUSEKEEPING_PURGE_BATCH_SIZE: ${HOUSEKEEPING_PURGE_BATCH_SIZE:-250}
      HOUSEKEEPING_RETENTION_POLL_MS: ${HOUSEKEEPING_RETENTION_POLL_MS:-30000}
      HOUSEKEEPING_ROLLUP_BUCKET_BATCH_SIZE: ${HOUSEKEEPING_ROLLUP_BUCKET_BATCH_SIZE:-60}
      HOUSEKEEPING_ROLLUP_POLL_MS: ${HOUSEKEEPING_ROLLUP_POLL_MS:-250}
      HOUSEKEEPING_SHUTDOWN_GRACE_MS: ${HOUSEKEEPING_SHUTDOWN_GRACE_MS:-30000}
      NODE_ENV: development
      PORT: 3013
      SERVICE_NAME: housekeeping-worker
      SERVICE_VERSION: 0.1.0
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3013/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    networks:
      - backend

  realtime-worker:
    profiles: [app]
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
      args:
        APP: realtime-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-site_monitor}:${POSTGRES_PASSWORD:-local_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-site_monitor}
      NODE_ENV: development
      PORT: 3014
      REALTIME_BATCH_SIZE: ${REALTIME_BATCH_SIZE:-100}
      REALTIME_DB_POOL_SIZE: ${REALTIME_DB_POOL_SIZE:-4}
      REALTIME_LEASE_SECONDS: ${REALTIME_LEASE_SECONDS:-30}
      REALTIME_MAX_DISPATCH_ATTEMPTS: ${REALTIME_MAX_DISPATCH_ATTEMPTS:-5}
      REALTIME_POLL_MS: ${REALTIME_POLL_MS:-100}
      REALTIME_RETRY_BASE_SECONDS: ${REALTIME_RETRY_BASE_SECONDS:-2}
      REALTIME_RETRY_CAP_SECONDS: ${REALTIME_RETRY_CAP_SECONDS:-60}
      REALTIME_SHUTDOWN_GRACE_MS: ${REALTIME_SHUTDOWN_GRACE_MS:-15000}
      SERVICE_NAME: realtime-worker
      SERVICE_VERSION: 0.1.0
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3014/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    networks:
      - backend

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-13000}
    environment:
      PORT: 8080
    ports:
      - '127.0.0.1:${WEB_PORT:-15173}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:8080/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    init: true
    restart: unless-stopped
    networks:
      - backend

  predictor:
    profiles: [prediction]
    build:
      context: .
      dockerfile: infra/docker/predictor.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-site_monitor}:${POSTGRES_PASSWORD:-local_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-site_monitor}
      PGOPTIONS: -c role=site_monitor_predictor
      HOST: 0.0.0.0
      PORT: 8000
      SERVICE_NAME: predictor
      SERVICE_VERSION: 0.1.0
    ports:
      - '127.0.0.1:${PREDICTOR_PORT:-18000}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    mem_limit: 512m
    cpus: '1.0'
    networks:
      - backend

volumes:
  postgres-data:
    name: site-monitor-postgres-data

networks:
  backend:
    name: site-monitor-backend
